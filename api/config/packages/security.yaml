security:
    enable_authenticator_manager: true
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        cors_options:
            pattern: ^/.*
            methods: [ OPTIONS ]
            stateless: true
            security: false
        login:
            pattern: ^/api/login_check
            stateless: true
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        google_auth:
            pattern: ^/api/login/google
            security: false
        api:
            pattern: ^/api
            stateless: true
            jwt: ~
            entry_point: lexik_jwt_authentication.jwt_token_authenticator
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        google_login:
            pattern: ^/api/login/google
            security: false
        main:
            #anonymous: true
            lazy: true
            provider: app_user_provider

            # Configuration du garde (Authenticator)
            guard:
                authenticators:
                    - App\Security\GoogleAuthenticator

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        # ACCÈS PUBLICS (Indispensable pour pouvoir se connecter)
        - { path: ^/api/auth/google,   roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/facebook, roles: PUBLIC_ACCESS }
        - { path: ^/api/public/customer/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/public/customer/login,    roles: PUBLIC_ACCESS }
        - { path: ^/api/public/customer/oauth,    roles: PUBLIC_ACCESS }
        - { path: ^/api/public/customer/me,       roles: ROLE_CUSTOMER }
        - { path: ^/api/public/customer/orders,   roles: ROLE_CUSTOMER }
        - { path: ^/api/public/reviews,           roles: PUBLIC_ACCESS }
        - { path: ^/api/reviews,                  roles: ROLE_ADMIN }
        - { path: ^/api/public, roles: PUBLIC_ACCESS }
        - { path: ^/api/menus,methods: [ GET ], roles: PUBLIC_ACCESS }
        - { path: ^/api/products, methods: [ GET ], roles: PUBLIC_ACCESS }
        - { path: ^/api/packs, methods: [ GET ], roles: PUBLIC_ACCESS }
        - { path: ^/api/categories, methods: [ GET ], roles: PUBLIC_ACCESS }
        - { path: ^/api/login_check, roles: PUBLIC_ACCESS }
        - { path: ^/api/login/google, roles: PUBLIC_ACCESS }
        - { path: ^/api/token/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/establishments, methods: GET, roles: PUBLIC_ACCESS }
        - { path: ^/api/establishments, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/impersonate, roles: IS_AUTHENTICATED_FULLY }
        # Autoriser la création de compte (POST sur /api/users) sans token
        - { path: ^/api/users$, roles: PUBLIC_ACCESS, methods: [ POST ] }

        # TOUT LE RESTE REQUIS UN TOKEN VALIDE
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
    #access_control:
        #- { path: ^/api/login_check, roles: PUBLIC_ACCESS }
        #- { path: ^/api/login/google, roles: PUBLIC_ACCESS }
        #- { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
        #- { path: ^/api/users$, roles: PUBLIC_ACCESS, methods: [ POST ] }

        #access_control:
        # Autoriser l'accès à la route de connexion
        #- { path: ^/api/login_check, roles: PUBLIC_ACCESS }
        # Exiger un token valide pour toutes les autres routes /api
        #- { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon

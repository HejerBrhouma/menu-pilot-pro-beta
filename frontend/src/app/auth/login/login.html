<div class="login-wrapper">
  <mat-card class="login-card shadow">
    <mat-card-header>
      <div class="header-content">
        <mat-icon color="primary" class="logo-icon">account_circle</mat-icon>
        <mat-card-title>Connexion</mat-card-title>
        <mat-card-subtitle>Accédez à Menu Pilot Pro</mat-card-subtitle>
      </div>
    </mat-card-header>

    <form (ngSubmit)="onLogin()">
      <mat-card-content>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" name="email"
                 [(ngModel)]="credentials.username" required
                 placeholder="votre@email.com">
          <mat-icon matSuffix>email</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Mot de passe</mat-label>
          <input matInput [type]="hidePassword() ? 'password' : 'text'"
                 name="password" [(ngModel)]="credentials.password" required>
          <button mat-icon-button matSuffix (click)="togglePassword($event)" type="button">
            <mat-icon>{{hidePassword() ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
        </mat-form-field>
      </mat-card-content>

      <mat-card-actions>
        <button mat-raised-button color="primary" class="full-width login-btn"
                [disabled]="isLoading()">
          {{ isLoading() ? 'Connexion...' : 'Se connecter' }}
        </button>
      </mat-card-actions>
    </form>
  </mat-card>
</div>

<!-- login.html -->
<div class="login-page">

  <div class="login-card">

    <!-- Logo + Titre -->
    <div class="login-hero">
      <div class="app-logo">
        <mat-icon>restaurant_menu</mat-icon>
      </div>
      <h1>Menu Pilot Pro</h1>
      <p>Connectez-vous à votre espace de gestion</p>
    </div>

    <!-- Loader social -->
    <div class="social-loading" *ngIf="socialLoading">
      <mat-spinner diameter="28"></mat-spinner>
      <span>Authentification en cours...</span>
    </div>

    <ng-container *ngIf="!socialLoading">

      <!-- Boutons sociaux -->
      <div class="social-btns">

        <!-- Google SDK caché -->
        <div id="google-login-btn"
             style="position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;overflow:hidden;">
        </div>

        <!-- Google custom -->
        <button class="social-btn google" (click)="loginWithGoogle()" type="button">
          <svg width="20" height="20" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Continuer avec Google
        </button>

        <!-- Facebook -->
        <button class="social-btn facebook" (click)="loginWithFacebook()" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
          Continuer avec Facebook
        </button>
      </div>

      <div class="divider"><span>ou</span></div>

      <!-- Formulaire email -->
      <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">

        <!-- Email -->
        <div class="input-group" [class.error]="f.email.invalid && f.email.touched">
          <mat-icon>email</mat-icon>
          <input formControlName="email" type="email" placeholder="Adresse email">
        </div>
        <span class="field-error" *ngIf="f.email.invalid && f.email.touched">
          Email invalide
        </span>

        <!-- Password -->
        <div class="input-group" [class.error]="f.password.invalid && f.password.touched">
          <mat-icon>lock</mat-icon>
          <input formControlName="password"
                 [type]="showPass ? 'text' : 'password'"
                 placeholder="Mot de passe">
          <button type="button" class="eye-btn" (click)="showPass = !showPass">
            <mat-icon>{{ showPass ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
        <span class="field-error" *ngIf="f.password.invalid && f.password.touched">
          Mot de passe requis
        </span>

        <!-- Erreur -->
        <div class="error-banner" *ngIf="error">
          <mat-icon>error_outline</mat-icon>
          {{ error }}
        </div>

        <!-- Submit -->
        <button type="submit" class="submit-btn" [disabled]="loading">
          <mat-spinner diameter="18" *ngIf="loading"></mat-spinner>
          <mat-icon *ngIf="!loading">login</mat-icon>
          {{ loading ? 'Connexion...' : 'Se connecter' }}
        </button>

      </form>

    </ng-container>

  </div>

</div>

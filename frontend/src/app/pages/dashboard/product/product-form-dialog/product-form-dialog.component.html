<!-- src/app/pages/dashboard/product/product-form-dialog/product-form-dialog.component.html -->

<div class="dialog-wrapper">
  <div class="dialog-header">
    <div class="dialog-title">
      <mat-icon>{{ isEdit ? 'edit' : 'add_circle' }}</mat-icon>
      <h2>{{ isEdit ? 'Modifier le produit' : 'Nouveau produit' }}</h2>
    </div>
    <button mat-icon-button (click)="cancel()"><mat-icon>close</mat-icon></button>
  </div>

  <mat-divider></mat-divider>

  <form [formGroup]="form" class="dialog-body">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nom du produit *</mat-label>
      <input matInput formControlName="name" placeholder="Ex: Pizza Royale">
      <mat-icon matSuffix>label</mat-icon>
      <mat-error>{{ nameError }}</mat-error>
    </mat-form-field>

    <div class="row-fields">
      <mat-form-field appearance="outline" class="price-field">
        <mat-label>Prix (€) *</mat-label>
        <input matInput type="number" formControlName="price" step="0.01">
        <mat-icon matSuffix>euro</mat-icon>
        <mat-error>{{ priceError }}</mat-error>
      </mat-form-field>

      <div class="toggle-field">
        <label class="toggle-label">Disponible</label>
        <mat-slide-toggle formControlName="isAvailable" color="primary"></mat-slide-toggle>
      </div>
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="3" placeholder="Décrivez votre produit…"></textarea>
      <mat-hint align="end">Optionnel</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Catégories</mat-label>
      <mat-select formControlName="categories" multiple>
        <mat-option *ngFor="let cat of data.categories" [value]="cat['@id']">
          {{ cat.name }}
        </mat-option>
      </mat-select>
      <mat-icon matSuffix>category</mat-icon>
    </mat-form-field>
  </form>

  <mat-divider></mat-divider>

  <div class="dialog-footer">
    <button mat-stroked-button (click)="cancel()">Annuler</button>
    <button mat-flat-button color="primary" (click)="submit()" [disabled]="form.invalid">
      <mat-icon>{{ isEdit ? 'save' : 'add' }}</mat-icon>
      {{ isEdit ? 'Enregistrer' : 'Créer le produit' }}
    </button>
  </div>
</div>

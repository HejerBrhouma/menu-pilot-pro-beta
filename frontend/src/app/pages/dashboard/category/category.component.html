<div class="p-6 max-w-4xl mx-auto">
  <h1 class="text-2xl font-bold mb-6">Gestion des Catégories</h1>

  <!-- Formulaire -->
  <div class="bg-white p-4 rounded shadow-md mb-8 flex gap-4">
    <input [(ngModel)]="newCategoryName"
           placeholder="Nom de la catégorie (ex: Boissons)"
           class="flex-grow border p-2 rounded outline-none focus:ring-2 focus:ring-green-500">
    <button (click)="saveCategory()"
            class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded transition-colors">
      Ajouter
    </button>
  </div>

  <!-- Liste -->
  <div class="bg-white rounded shadow-md overflow-hidden">
    <table class="w-full text-left">
      <thead class="bg-gray-50 border-b">
      <tr>
        <th class="p-4 font-semibold">Nom de la catégorie</th>
        <th class="p-4 font-semibold text-right">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let cat of categories" class="border-b hover:bg-gray-50">
        <td class="p-4">{{ cat.name }}</td>
        <td class="p-4 text-right">
          <button class="text-red-500 hover:text-red-700">Supprimer</button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

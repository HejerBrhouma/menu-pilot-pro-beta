<!-- src/app/pages/super-admin/users/reset-password-dialog/reset-password-dialog.component.html -->

<div class="dialog-header">
  <mat-icon>lock_reset</mat-icon>
  <h2>Réinitialiser le mot de passe</h2>
</div>

<mat-dialog-content>
  <p class="user-info">
    <mat-icon>person</mat-icon>
    {{ data.user.firstName }} {{ data.user.lastName }} — {{ data.user.email }}
  </p>

  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nouveau mot de passe </mat-label>
      <input matInput formControlName="password" [type]="showPwd ? 'text' : 'password'">
      <button mat-icon-button matSuffix type="button" (click)="showPwd = !showPwd">
        <mat-icon>{{ showPwd ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-hint>Minimum 8 caractères</mat-hint>
      <mat-error *ngIf="form.get('password')?.hasError('minlength')">
        Minimum 8 caractères
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button mat-dialog-close>Annuler</button>
  <button mat-flat-button color="warn" (click)="confirm()" [disabled]="form.invalid">
    <mat-icon>lock_reset</mat-icon>
    Réinitialiser
  </button>
</mat-dialog-actions>

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    index index.php;

    # Servir les fichiers uploadés directement (logos, images...)
    location /uploads/ {
        alias /var/www/html/public/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 600;
        include fastcgi_params;
    }

    location ~ /\.(ht|svn|git) {
        deny all;
    }
    location /uploads/products/ {
        alias /var/www/html/public/uploads/products/;
    }

    location /uploads/logos/ {
        alias /var/www/html/public/uploads/logos/;
    }
    client_max_body_size 20M;

}
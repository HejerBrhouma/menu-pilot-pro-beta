version: '3.8'

services:
  # 1. SERVICE API (SYMFONY - PHP-FPM)
  api:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: digimenu_symfony_fpm
    volumes:
      - ./api:/var/www/html
    environment:
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@database:${DB_PORT}/${DB_NAME}?serverVersion=mariadb-10.11.2
      MERCURE_URL: http://mercure:3000/.well-known/mercure
      MERCURE_PUBLIC_URL: http://localhost:3000/.well-known/mercure
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET}
    depends_on:
      - database
      - mercure

  # 2. SERVEUR WEB (NGINX)
  nginx:
    image: nginx:stable-alpine
    container_name: digimenu_nginx
    restart: unless-stopped
    ports:
      - "${SYMFONY_PORT}:80"
    volumes:
      - ./api:/var/www/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  # 3. BASE DE DONNÉES (MARIADB)
  database:
    image: mariadb:10.11
    container_name: digimenu_mariadb
    restart: always
    volumes:
      - db-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

  # 4. ADMIN DE BASE DE DONNÉES (PHPMYADMIN)
  pma:
    image: phpmyadmin:latest
    container_name: digimenu_phpmyadmin
    restart: always
    ports:
      - "${PMA_PORT}:80"
    environment:
      PMA_HOST: database
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    depends_on:
      - database

  # 5. ANGULAR
  node_management:
    build:
      context: ./docker/angular
      dockerfile: Dockerfile
    container_name: digimenu_angular_cli
    user: node
    volumes:
      - ./frontend:/src/app
      - /src/app/node_modules
    ports:
      - "${ANGULAR_PORT}:4200"
    command: "npm start"

  # 6. MERCURE HUB (temps réel WebSocket/SSE)
  mercure:
    image: dunglas/mercure
    container_name: digimenu_mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ':3000'
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins "*"
        anonymous
    ports:
      - "3000:3000"

volumes:
  db-data: